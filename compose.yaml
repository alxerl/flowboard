services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowboard
      POSTGRES_PASSWORD: flowboard
      POSTGRES_DB: flowboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowboard"]
      interval: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgres://flowboard:flowboard@db:5432/flowboard?sslmode=disable
      PORT: "8080"
      DEMO_MODE: "${DEMO_MODE:-1}"
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
