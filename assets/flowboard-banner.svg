    <rect x="730" y="46" width="500" height="266" rx="18" fill="#f5f7fc"/>
    <rect x="730" y="46" width="500" height="42" rx="18" fill="#ffffff"/>
    <rect x="730" y="70" width="500" height="18" fill="#ffffff"/>
    <circle cx="755" cy="67" r="5" fill="#ff7d84"/>
    <circle cx="772" cy="67" r="5" fill="#f5c870"/>
