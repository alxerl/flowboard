<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Flowboard, a delivery workspace for software teams">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101a30"/>
      <stop offset="1" stop-color="#1c2750"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#8178ff"/>
      <stop offset="1" stop-color="#54c3d2"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#060b1e" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1020" cy="18" r="250" fill="#625af5" opacity=".1"/>
  <circle cx="1210" cy="285" r="215" fill="#49c4c2" opacity=".07"/>
  <path d="M0 310 C240 250 370 390 660 315" fill="none" stroke="#8178ff" stroke-opacity=".09" stroke-width="2"/>

  <rect x="60" y="57" width="52" height="52" rx="14" fill="url(#accent)"/>
  <text x="86" y="94" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800">F</text>
  <text x="128" y="92" fill="#f8f9ff" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" letter-spacing="-.8">Flowboard</text>
  <text x="62" y="157" fill="#918aff" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="3">DELIVERY WORKSPACE</text>
  <text x="60" y="210" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="800" letter-spacing="-1.3">From issue to shipped.</text>
  <text x="62" y="247" fill="#b5c0d6" font-family="Arial,Helvetica,sans-serif" font-size="18">Plan work, connect GitHub, and spot what slows delivery.</text>
  <rect x="60" y="280" width="92" height="30" rx="15" fill="#303c61"/>
  <text x="106" y="300" text-anchor="middle" fill="#c9c6ff" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">Go API</text>
  <rect x="162" y="280" width="128" height="30" rx="15" fill="#303c61"/>
  <text x="226" y="300" text-anchor="middle" fill="#c9c6ff" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">GitHub sync</text>
  <rect x="300" y="280" width="123" height="30" rx="15" fill="#303c61"/>
  <text x="361" y="300" text-anchor="middle" fill="#c9c6ff" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">Insights</text>

