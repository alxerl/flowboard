    <text x="818" y="72" fill="#6c7891" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700">ATLAS RELEASE / BOARD</text>

    <rect x="752" y="108" width="140" height="181" rx="9" fill="#e9edf5"/>
    <rect x="904" y="108" width="140" height="181" rx="9" fill="#e9edf5"/>
