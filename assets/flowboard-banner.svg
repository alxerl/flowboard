    <text x="780" y="133" fill="#59677f" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="800" letter-spacing=".7">IN PROGRESS</text>
    <text x="932" y="133" fill="#59677f" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="800" letter-spacing=".7">IN REVIEW</text>
