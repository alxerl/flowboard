    <rect x="762" y="147" width="120" height="99" rx="8" fill="#ffffff"/>
    <text x="772" y="166" fill="#8290a5" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700">ATL-12</text>
    <text x="772" y="188" fill="#26334e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">Build API</text>
    <text x="772" y="204" fill="#26334e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">endpoint</text>
    <rect x="772" y="222" width="42" height="13" rx="4" fill="#ffede8"/>
    <text x="793" y="231" text-anchor="middle" fill="#d57b5d" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700">HIGH</text>

    <rect x="914" y="147" width="120" height="99" rx="8" fill="#ffffff"/>
    <text x="924" y="166" fill="#8290a5" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700">ATL-08</text>
    <text x="924" y="188" fill="#26334e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">Review pull</text>
    <text x="924" y="204" fill="#26334e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">request</text>
    <rect x="924" y="222" width="46" height="13" rx="4" fill="#f0efff"/>
    <text x="947" y="231" text-anchor="middle" fill="#7167d8" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700">PR #42</text>

    <rect x="1066" y="147" width="132" height="99" rx="8" fill="#ffffff"/>
    <text x="1076" y="166" fill="#8290a5" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700">ATL-05</text>
    <text x="1076" y="188" fill="#26334e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">Ship release</text>
    <text x="1076" y="204" fill="#26334e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">dashboard</text>
